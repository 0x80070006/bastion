[workspace]
resolver = "3"
members = ["crates/bastion-proto", "crates/bastion-crypto", "relay", "desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://example.invalid/bastion"
publish = false

[workspace.dependencies]
bastion-proto = { path = "crates/bastion-proto" }
bastion-crypto = { path = "crates/bastion-crypto" }
bastion-relay = { path = "relay" }
# Cryptography: pure-Rust, byte-compatible with libsodium (ADR-0016).
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10.1"
blake2 = "0.10.6"
argon2 = { version = "0.5.3", features = ["zeroize"] }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4.3"
base64 = "0.22.1"
# Relay storage and TLS (ring provider: no C++/NASM toolchain needed, TLS 1.3 only).
rusqlite = { version = "0.40.2", features = ["bundled"] }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
bytes = "1"
http-body-util = "0.1"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tauri = { version = "2.12.1", features = [] }
tauri-build = { version = "2.7.1", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
