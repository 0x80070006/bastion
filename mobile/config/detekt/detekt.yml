# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: false

complexity:
  LongParameterList:
    # Protocol derivations take every key they bind; grouping them would hide that.
    functionThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInInterfaces: 15
    thresholdInClasses: 15
    ignoreAnnotatedFunctions: ['Preview']

exceptions:
  # Never swallow exceptions silently (docs/ARCHITECTURE.md §7).
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
