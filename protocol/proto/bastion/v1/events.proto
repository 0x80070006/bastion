// Events reported by a phone to its controllers.
syntax = "proto3";

package bastion.v1;

import "bastion/v1/commands.proto";

option java_multiple_files = true;
option java_package = "org.bastion.protocol.v1";

message Event {
  oneof kind {
    LocationReport location = 1;
    StatusReport status = 2;
    Alert alert = 3;
    PhotoReport photo = 4;
    LastChanceBeacon last_chance = 5;
    MediaFrame media_frame = 6;
    AudioChunk audio_chunk = 7;
    ScreenFrame screen_frame = 8;
    ContactsPage contacts_page = 9;
    CallState call_state = 10;
    SmsPage sms_page = 11;
    SmsReceived sms_received = 12;
  }
}

message Location {
  // WGS84 degrees.
  double latitude = 1;
  double longitude = 2;
  // Horizontal accuracy radius, metres (68% confidence).
  float accuracy_m = 3;
  // Optional fields; has_* semantics via proto3 optional.
  optional double altitude_m = 4;
  optional float speed_mps = 5;
  optional float bearing_deg = 6;
  enum Provider {
    PROVIDER_UNSPECIFIED = 0;
    PROVIDER_GPS = 1;
    PROVIDER_NETWORK = 2;
    PROVIDER_PASSIVE = 3;
  }
  Provider provider = 7;
  // Fix time, Unix epoch milliseconds.
  int64 fix_time_ms = 8;
}

message LocationReport {
  repeated Location locations = 1;
}

message BatteryState {
  // 0..100.
  uint32 level_percent = 1;
  bool charging = 2;
}

enum NetworkType {
  NETWORK_TYPE_UNSPECIFIED = 0;
  NETWORK_TYPE_NONE = 1;
  NETWORK_TYPE_WIFI = 2;
  NETWORK_TYPE_CELLULAR = 3;
  NETWORK_TYPE_ETHERNET = 4;
  NETWORK_TYPE_OTHER = 5;
}

// Each protection feature and its health, as shown on the phone's Health screen.
message ProtectionHealth {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ACTIVE = 1;
    STATE_DISABLED = 2;
    STATE_DEGRADED = 3;
  }
  // Stable machine identifier, e.g. "location", "device_admin", "battery_exemption".
  string feature = 1;
  State state = 2;
  // Machine-readable reason, e.g. "permission_revoked".
  string reason_code = 3;
}

message StatusReport {
  BatteryState battery = 1;
  NetworkType network = 2;
  TrackingMode tracking_mode = 3;
  bool lost_mode = 4;
  bool vpn_connected = 5;
  repeated ProtectionHealth health = 6;
  // App version name, informational.
  string app_version = 7;
}

message Alert {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SIM_CHANGED = 1;
    TYPE_SIM_REMOVED = 2;
    TYPE_FAILED_UNLOCK = 3;
    TYPE_GEOFENCE_EXIT = 4;
    TYPE_GEOFENCE_ENTER = 5;
    TYPE_BATTERY_CRITICAL = 6;
    TYPE_SEPARATION = 7;
    TYPE_PROTECTION_WEAKENED = 8;
    TYPE_NETWORK_CUT = 9;
    TYPE_MOTION_DETECTED = 10;
    TYPE_ADMIN_DISABLE_REQUESTED = 11;
    TYPE_SHUTDOWN = 12;
  }
  Type type = 1;
  optional Location location = 2;
  // Type-specific machine-readable detail, e.g. failed attempt count or geofence id.
  map<string, string> detail = 3;
  // message_id of an associated PhotoReport, if any.
  bytes photo_message_id = 4;
}

message PhotoReport {
  // JPEG, max 384 KiB (enforced before encryption).
  bytes jpeg = 1;
  int64 captured_at_ms = 2;
  optional Location location = 3;
  CapturePhoto.Camera camera = 4;
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    // Owner requested the photo from the controller.
    TRIGGER_ON_DEMAND = 1;
    // Taken automatically after repeated failed unlocks.
    TRIGGER_FAILED_UNLOCK = 2;
  }
  Trigger trigger = 5;
  // message_id of the CapturePhoto command this answers, if any.
  bytes command_message_id = 6;
}

// One frame of a near-live camera stream (StreamControl). Frames are ordinary end-to-end
// events; the controller drops out-of-order or stale frames by sequence and timestamp.
message MediaFrame {
  // Strictly increasing within one stream session.
  uint64 sequence = 1;
  int64 captured_at_ms = 2;
  CapturePhoto.Camera camera = 3;
  // JPEG, max 384 KiB (enforced before encryption).
  bytes jpeg = 4;
  uint32 width = 5;
  uint32 height = 6;
}

// One chunk of a near-live microphone stream (AudioControl). Signed 16-bit little-endian PCM,
// single channel, at `sample_rate` Hz.
message AudioChunk {
  // Strictly increasing within one audio session.
  uint64 sequence = 1;
  int64 captured_at_ms = 2;
  // 16-bit mono PCM, max 384 KiB.
  bytes pcm = 3;
  uint32 sample_rate = 4;
}

// One frame of a near-live screen mirror (ScreenControl). Frames are ordinary end-to-end events;
// the controller drops out-of-order or stale frames by sequence and timestamp. `width`/`height`
// are the transmitted frame's pixels; the controller maps normalised RemoteInput coordinates
// against them.
message ScreenFrame {
  // Strictly increasing within one screen session.
  uint64 sequence = 1;
  int64 captured_at_ms = 2;
  // JPEG, max 384 KiB (the phone lowers quality/size to fit before encryption).
  bytes jpeg = 3;
  uint32 width = 4;
  uint32 height = 5;
  // True when the phone is currently showing a secure keyguard, so input is being withheld and
  // the controller should show a "locked" hint.
  bool locked = 6;
}

message Contact {
  // Display name, max 128 characters.
  string name = 1;
  // Phone numbers as stored, at most 5 per contact, each max 32 characters.
  repeated string numbers = 2;
}

// One page of the address book (ContactsRequest). `total` is the number of matches, so the
// controller can ask for the next page.
message ContactsPage {
  uint32 offset = 1;
  uint32 total = 2;
  repeated Contact contacts = 3;
  // The request's query, echoed so a late page for an old search is dropped.
  string query = 4;
}

// Current state of the phone's call, pushed on every change (CallControl or a call the owner
// places or receives on the phone itself).
message CallState {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_IDLE = 1;
    STATE_RINGING = 2;
    STATE_DIALING = 3;
    STATE_ACTIVE = 4;
  }
  State state = 1;
  // Remote number, empty when idle or hidden.
  string number = 2;
  // Contact name for `number`, if known.
  string name = 3;
  bool speaker = 4;
  // Phone-side time of this change, Unix epoch milliseconds.
  int64 at_ms = 5;
  // Machine-readable reason when a CallControl was refused, e.g. "call_permission_denied".
  string error = 6;
}

message SmsMessage {
  // Remote number as stored by the phone, max 32 characters.
  string address = 1;
  // Contact name for `address`, if known, max 128 characters.
  string name = 2;
  // Plain text, max 1000 characters.
  string body = 3;
  // Message time, Unix epoch milliseconds.
  int64 at_ms = 4;
  // True when sent from this phone, false when received.
  bool outgoing = 5;
}

// Answer to SmsList: newest first. `peer` echoes the request (empty = conversation list).
message SmsPage {
  string peer = 1;
  repeated SmsMessage messages = 2;
}

// A message that just arrived on the phone.
message SmsReceived {
  SmsMessage message = 1;
}

message LastChanceBeacon {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_BATTERY_LOW = 1;
    REASON_AIRPLANE_MODE = 2;
    REASON_NETWORK_LOST = 3;
    REASON_SHUTDOWN = 4;
  }
  Reason reason = 1;
  optional Location location = 2;
  BatteryState battery = 3;
}
