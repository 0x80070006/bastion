// Commands sent by a controller (desktop) to a phone.
syntax = "proto3";

package bastion.v1;

option java_multiple_files = true;
option java_package = "org.bastion.protocol.v1";

message Command {
  oneof kind {
    Ring ring = 1;
    StopRing stop_ring = 2;
    LocateNow locate_now = 3;
    SetTrackingMode set_tracking_mode = 4;
    LostMode lost_mode = 5;
    // Sensitive: requires privileged_signature.
    Lock lock = 6;
    CapturePhoto capture_photo = 7;
    // Sensitive: requires privileged_signature.
    Wipe wipe = 8;
    // Sensitive: requires privileged_signature.
    Unpair unpair = 9;
    RequestStatus request_status = 10;
    StreamControl stream_control = 11;
    AudioControl audio_control = 12;
    SetGeofences set_geofences = 13;
    // Owner remote control of the device's own screen (requires a one-time on-device consent,
    // or Device Owner provisioning). Never bypasses the lock screen.
    ScreenControl screen_control = 14;
    RemoteInput remote_input = 15;
    // Two-way voice intercom: the phone streams its microphone (AudioChunk events) and plays the
    // controller's voice (AudioPlay commands) through its speaker. The OS mic indicator stays on.
    IntercomControl intercom_control = 16;
    AudioPlay audio_play = 17;
    // Owner reads the phone's address book and places calls over the phone's own SIM. Needs the
    // READ_CONTACTS / CALL_PHONE runtime permissions, granted on the phone by the owner.
    ContactsRequest contacts_request = 18;
    CallControl call_control = 19;
    // Text messages over the phone's own SIM. Needs the SEND_SMS / READ_SMS runtime permissions.
    SmsSend sms_send = 20;
    SmsList sms_list = 21;
  }
}

message Ring {
  // 0 = until stopped from the controller or by owner authentication on the phone.
  uint32 duration_seconds = 1;
  bool flashlight = 2;
  bool vibrate = 3;
}

message StopRing {}

message LocateNow {
  bool high_accuracy = 1;
}

enum TrackingMode {
  TRACKING_MODE_UNSPECIFIED = 0;
  // Sparse, battery-friendly reports.
  TRACKING_MODE_STANDBY = 1;
  // Short interval, high accuracy.
  TRACKING_MODE_ACTIVE = 2;
  // Active tracking + lost-mode alerts.
  TRACKING_MODE_LOST = 3;
}

message SetTrackingMode {
  TrackingMode mode = 1;
  // 0 = mode default.
  uint32 interval_seconds = 2;
}

// Owner contact info shown on the lock screen. Must not contain personal data
// beyond what the owner explicitly typed.
message ContactCard {
  // Max 280 UTF-8 characters, enforced by the receiver.
  string message = 1;
  // Max 64 characters.
  string phone = 2;
  // Max 128 characters.
  string email = 3;
}

message LostMode {
  bool enabled = 1;
  ContactCard contact = 2;
}

message Lock {
  ContactCard contact = 1;
}

message CapturePhoto {
  enum Camera {
    CAMERA_UNSPECIFIED = 0;
    CAMERA_FRONT = 1;
    CAMERA_BACK = 2;
  }
  Camera camera = 1;
}

// Near-live camera stream over the end-to-end channel. The phone emits MediaFrame events
// (events.proto) while enabled. The OS camera indicator is always visible; the phone enforces
// an owner-chosen maximum duration so a stream cannot run indefinitely.
message StreamControl {
  bool enabled = 1;
  CapturePhoto.Camera camera = 2;
  // Target frames per second, clamped by the phone to 1..10.
  uint32 max_fps = 3;
  // Longest edge of each frame in pixels, clamped by the phone (e.g. 240..1280).
  uint32 max_edge_px = 4;
  // Hard stop after this many seconds, clamped by the phone to 1..300 (0 = phone default).
  uint32 max_duration_seconds = 5;
}

// Near-live microphone stream over the end-to-end channel. The OS microphone indicator is
// always visible; recording another person may be legally restricted (shown before start).
message AudioControl {
  bool enabled = 1;
  // Hard stop after this many seconds, clamped by the phone to 1..300 (0 = phone default).
  uint32 max_duration_seconds = 2;
}

// A circular geofence the phone watches, alerting on entry and exit.
message Geofence {
  // Stable identifier chosen by the controller.
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  // Radius in metres (the phone clamps it to a sane minimum).
  float radius_m = 4;
  // Human-readable label, max 64 chars.
  string name = 5;
}

// Replaces the full set of geofences on the phone (empty list disables geofencing).
message SetGeofences {
  repeated Geofence zones = 1;
}

// Near-live mirror of the phone's own display over the end-to-end channel, for the owner to
// see and (with RemoteInput) drive their phone like an emulator. Capturing the screen requires
// an explicit on-device consent that only the owner can grant (a thief cannot), or the app being
// provisioned as Device Owner. The phone enforces a maximum duration; the OS screen-cast
// indicator is always visible. Secure/DRM surfaces appear blank in the capture.
message ScreenControl {
  bool enabled = 1;
  // Target frames per second, clamped by the phone to 1..15.
  uint32 max_fps = 2;
  // Longest edge of each frame in pixels, clamped by the phone (e.g. 240..1600).
  uint32 max_edge_px = 3;
  // Hard stop after this many seconds, clamped by the phone to 1..900 (0 = phone default).
  uint32 max_duration_seconds = 4;
  // Keep the screen awake while mirroring (wakes a sleeping display; never unlocks it).
  bool keep_awake = 5;
}

// A single input action injected into the phone, via its accessibility service. Coordinates are
// normalised to 0..1 of the current display, so they are independent of the frame resolution.
// Input never reaches a locked keyguard: while the phone is locked, only WAKE is honoured.
message RemoteInput {
  oneof action {
    Tap tap = 1;
    Swipe swipe = 2;
    TextInput text = 3;
    GlobalAction global = 4;
  }
}

message Tap {
  float x = 1;
  float y = 2;
  // Long press instead of a short tap.
  bool long_press = 3;
}

message Swipe {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  // Gesture duration, clamped by the phone to 20..3000 ms.
  uint32 duration_ms = 5;
}

message TextInput {
  // UTF-8 text to insert into the focused field, max 2048 bytes (enforced by the receiver).
  string text = 1;
  // Submit after inserting (presses the editor action / Enter).
  bool submit = 2;
}

enum GlobalAction {
  GLOBAL_ACTION_UNSPECIFIED = 0;
  GLOBAL_ACTION_BACK = 1;
  GLOBAL_ACTION_HOME = 2;
  GLOBAL_ACTION_RECENTS = 3;
  GLOBAL_ACTION_NOTIFICATIONS = 4;
  GLOBAL_ACTION_QUICK_SETTINGS = 5;
  // Wake the display (PowerManager wake lock); does not unlock the keyguard.
  GLOBAL_ACTION_WAKE = 6;
  // Lock the screen (accessibility lock; API 28+).
  GLOBAL_ACTION_LOCK = 7;
}

// Starts or stops a two-way voice intercom. While enabled the phone captures its microphone and
// emits AudioChunk events (phone→controller) and opens its speaker for AudioPlay chunks
// (controller→phone). The OS microphone indicator is always visible; the phone enforces a maximum
// duration. Recording/among another person may be legally restricted (shown before start).
message IntercomControl {
  bool enabled = 1;
  // Hard stop after this many seconds, clamped by the phone to 1..900 (0 = phone default).
  uint32 max_duration_seconds = 2;
}

// One chunk of the controller's voice to play on the phone's speaker during an intercom session.
// Signed 16-bit little-endian PCM, single channel, at `sample_rate` Hz. Fire-and-forget: late or
// out-of-order chunks are dropped by the phone.
message AudioPlay {
  uint64 sequence = 1;
  // 16-bit mono PCM, max 384 KiB.
  bytes pcm = 2;
  uint32 sample_rate = 3;
}

// Asks for one page of the phone's address book, answered by a ContactsPage event. Contacts are
// never persisted on the controller: they live in memory for the length of the session.
message ContactsRequest {
  // Case-insensitive substring of the name or number; empty = everything.
  string query = 1;
  uint32 offset = 2;
  // Clamped by the phone to 1..200 (0 = 100).
  uint32 limit = 3;
}

// Drives a phone call on the phone's own SIM. The call audio stays on the phone (speaker or
// earpiece): Android does not let a third-party app capture or inject call audio. A dialled
// number is only placed with the owner's CALL_PHONE grant; the lock screen is never bypassed.
message CallControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_DIAL = 1;
    ACTION_ANSWER = 2;
    ACTION_HANGUP = 3;
    ACTION_SPEAKER_ON = 4;
    ACTION_SPEAKER_OFF = 5;
  }
  Action action = 1;
  // Required for ACTION_DIAL: digits, +, *, # only, max 32 characters (enforced by the receiver).
  string number = 2;
}

// Sends one text message from the phone's SIM. The body is plain text, max 1000 characters.
message SmsSend {
  // Digits, +, *, # only, max 32 characters (enforced by the receiver).
  string to = 1;
  string body = 2;
}

// Reads text messages, answered by an SmsPage event. With an empty `peer` the phone returns the
// latest message of each conversation; otherwise the most recent messages exchanged with `peer`.
message SmsList {
  string peer = 1;
  // Clamped by the phone to 1..50 (0 = 30).
  uint32 limit = 2;
}

message Wipe {
  // Also wipe adopted/external storage when the OS allows it.
  bool include_external_storage = 1;
}

message Unpair {}

message RequestStatus {}
